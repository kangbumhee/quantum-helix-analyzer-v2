<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Shopee Optimizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>Shopee Optimizer</h1>
    <p class="subtitle">쇼피 셀러 분석 & AI 최적화</p>
  </div>

  <div id="loginStatus" class="status-bar"></div>

  <button id="btnConnectCookie" class="btn btn-connect">쿠키로 연결</button>

  <div id="shopSection" class="section" style="display:none;">
    <div id="shopList" class="shop-list"></div>
    <div class="actions">
      <button id="btnAnalyzeAll" class="btn btn-primary">전체 분석</button>
      <button id="btnDashboard" class="btn btn-secondary">대시보드</button>
    </div>
  </div>

  <div id="progressSection" class="section" style="display:none;">
    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
    <p id="progressText" class="progress-text"></p>
  </div>

  <div id="recentResults" class="section" style="display:none;"></div>

  <script src="popup.js"></script>
</body>
</html>
