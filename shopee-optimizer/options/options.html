<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Shopee Optimizer - 설정</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f23; color: #e0e0e0; font-family: -apple-system, sans-serif; padding: 24px; max-width: 600px; margin: 0 auto; }
    h1 { color: #fff; margin-bottom: 24px; }
    h2 { color: #c0c0d0; margin: 20px 0 12px; font-size: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; color: #aaa; margin-bottom: 4px; }
    .field input, .field select {
      width: 100%; padding: 8px 12px; background: #1a1a2e; color: #e0e0e0;
      border: 1px solid #444; border-radius: 6px; font-size: 14px;
    }
    .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; }
    .switch-row label { color: #e0e0e0; font-size: 14px; }
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background: #444; border-radius: 24px; transition: .3s; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
    .switch input:checked + .slider { background: #7c4dff; }
    .switch input:checked + .slider:before { transform: translateX(20px); }
    .actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .btn-save { background: #7c4dff; color: #fff; }
    .btn-save:hover { background: #651fff; }
    .btn-reset { background: #333; color: #e0e0e0; }
    .btn-reset:hover { background: #444; }
    .btn-test { background: #2196F3; color: #fff; font-size: 12px; padding: 6px 12px; margin-left: 8px; }
    #testResult { font-size: 12px; margin-top: 6px; }
    #testResult.ok { color: #4caf50; }
    #testResult.fail { color: #f44336; }
  </style>
</head>
<body>
  <h1>Shopee Optimizer 설정</h1>

  <h2>Gemini API 설정</h2>
  <div class="field">
    <label>API Key</label>
    <div style="display:flex;align-items:center;">
      <input type="password" id="geminiKey" placeholder="Gemini API 키를 입력하세요" style="flex:1;">
      <button class="btn btn-test" id="btnTestApi">테스트</button>
    </div>
    <div id="testResult"></div>
  </div>
  <div class="field">
    <label>모델 선택</label>
    <select id="geminiModel">
      <option value="gemini-2.0-flash">Gemini 2.0 Flash (빠름)</option>
      <option value="gemini-2.5-flash">Gemini 2.5 Flash (최신)</option>
      <option value="gemini-1.5-pro">Gemini 1.5 Pro (고품질)</option>
    </select>
  </div>

  <h2>제목 최적화</h2>
  <div class="field">
    <label>최대 제목 길이</label>
    <input type="number" id="maxTitleLength" min="50" max="200" value="120">
  </div>
  <div class="field">
    <label>키워드 위치</label>
    <select id="keywordPosition">
      <option value="front">앞쪽 (권장)</option>
      <option value="natural">자연스럽게</option>
      <option value="back">뒤쪽</option>
    </select>
  </div>
  <div class="field">
    <label>브랜드명 유지</label>
    <select id="keepBrand">
      <option value="always">항상 유지</option>
      <option value="if_space">공간 여유 시</option>
      <option value="never">제거 가능</option>
    </select>
  </div>

  <h2>Freshness Boost</h2>
  <div class="switch-row">
    <label>자동 로테이션</label>
    <div class="switch">
      <input type="checkbox" id="freshnessRotationEnabled">
      <span class="slider"></span>
    </div>
  </div>
  <div class="field">
    <label>일일 수정 상품 수</label>
    <input type="number" id="productsPerDay" min="1" max="50" value="7">
  </div>
  <div class="field">
    <label>로테이션 간격 (일)</label>
    <input type="number" id="rotationInterval" min="1" max="30" value="7">
  </div>

  <h2>안전 설정</h2>
  <div class="switch-row">
    <label>수정 전 승인 필요</label>
    <div class="switch">
      <input type="checkbox" id="approvalRequired" checked>
      <span class="slider"></span>
    </div>
  </div>
  <div class="switch-row">
    <label>자동 백업</label>
    <div class="switch">
      <input type="checkbox" id="autoBackup" checked>
      <span class="slider"></span>
    </div>
  </div>

  <h2>자동 분석</h2>
  <div class="field">
    <label>자동 분석 간격 (시간)</label>
    <input type="number" id="autoAnalyzeInterval" min="1" max="168" value="24">
  </div>
  <div class="switch-row">
    <label>알림 활성화</label>
    <div class="switch">
      <input type="checkbox" id="notificationsEnabled" checked>
      <span class="slider"></span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-reset" id="btnReset">초기화</button>
    <button class="btn btn-save" id="btnSave">저장</button>
  </div>

  <script src="options.js"></script>
</body>
</html>
