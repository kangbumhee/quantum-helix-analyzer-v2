<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Shopee Optimizer 설정</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0f0f23; color: #e0e0e0; padding: 40px; min-height: 100vh; }
    .container { max-width: 640px; margin: 0 auto; }
    h1 { color: #00d4aa; margin-bottom: 8px; font-size: 24px; }
    .subtitle { color: #888; margin-bottom: 32px; font-size: 14px; }
    .section { background: #1a1a2e; border-radius: 12px; padding: 24px; margin-bottom: 20px; border: 1px solid #2a2a4a; }
    .section h2 { color: #00d4aa; font-size: 16px; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #aaa; margin-bottom: 6px; }
    input[type="text"], input[type="password"], select {
      width: 100%; padding: 10px 14px; background: #0f0f23; border: 1px solid #3a3a5a;
      border-radius: 8px; color: #e0e0e0; font-size: 14px; margin-bottom: 16px;
    }
    input:focus, select:focus { outline: none; border-color: #00d4aa; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    .btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 600; }
    .btn-primary { background: #00d4aa; color: #0f0f23; }
    .btn-primary:hover { background: #00eebb; }
    .btn-secondary { background: #2a2a4a; color: #e0e0e0; }
    .btn-test { background: #3a3a5a; color: #00d4aa; margin-left: 8px; }
    .status { font-size: 12px; margin-top: 8px; padding: 8px; border-radius: 6px; display: none; }
    .status.success { display: block; background: #0a2a1a; color: #00d4aa; border: 1px solid #00d4aa33; }
    .status.error { display: block; background: #2a0a0a; color: #ff6b6b; border: 1px solid #ff6b6b33; }
    .help { font-size: 12px; color: #666; margin-top: -12px; margin-bottom: 16px; }
    .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #2a2a4a; }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-label { font-size: 14px; }
    .toggle-desc { font-size: 12px; color: #666; margin-top: 2px; }
    .switch { position: relative; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background: #3a3a5a; border-radius: 24px; transition: 0.3s; }
    .slider:before { content: ""; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #888; border-radius: 50%; transition: 0.3s; }
    input:checked + .slider { background: #00d4aa; }
    input:checked + .slider:before { transform: translateX(20px); background: #0f0f23; }
    .footer-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚙️ Shopee Optimizer 설정</h1>
    <p class="subtitle">AI 기반 상품 최적화 설정을 관리합니다</p>

    <div class="section">
      <h2>🤖 Gemini API 설정</h2>
      <label>API Key</label>
      <div style="display:flex; gap:8px;">
        <input type="password" id="geminiKey" placeholder="AIzaSy... (Google AI Studio에서 발급)">
        <button class="btn btn-test" id="btnTestKey">테스트</button>
      </div>
      <p class="help">무료: <a href="https://aistudio.google.com/apikey" target="_blank" style="color:#00d4aa;">Google AI Studio</a>에서 API Key 발급 (Gemini 2.5 Flash 무료 사용 가능)</p>
      <div id="keyStatus" class="status"></div>

      <label>AI 모델</label>
      <select id="geminiModel">
        <option value="gemini-2.5-flash">Gemini 2.5 Flash (추천 - 무료, 빠름)</option>
        <option value="gemini-2.0-flash">Gemini 2.0 Flash (무료, 안정적)</option>
        <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite (무료, 가장 저렴)</option>
        <option value="gemini-2.5-pro">Gemini 2.5 Pro (무료, 최고 품질)</option>
        <option value="gemini-3-flash">Gemini 3 Flash (최신, 무료)</option>
      </select>
    </div>

    <div class="section">
      <h2>📝 제목 최적화 설정</h2>
      <div class="row">
        <div>
          <label>최대 제목 길이</label>
          <input type="text" id="maxTitleLength" value="120">
        </div>
        <div>
          <label>키워드 삽입 위치</label>
          <select id="keywordPosition">
            <option value="front">앞쪽 (추천)</option>
            <option value="natural">자연스럽게 배치</option>
            <option value="back">뒤쪽</option>
          </select>
        </div>
      </div>
      <label>브랜드명 유지</label>
      <select id="keepBrand">
        <option value="always">항상 유지</option>
        <option value="front">항상 맨 앞에</option>
        <option value="flexible">AI 판단에 맡김</option>
      </select>
    </div>

    <div class="section">
      <h2>🔄 Freshness Boost 설정</h2>
      <div class="toggle-row">
        <div>
          <div class="toggle-label">자동 Freshness 로테이션</div>
          <div class="toggle-desc">7일마다 상품 제목을 미세 수정하여 검색 노출 유지</div>
        </div>
        <label class="switch"><input type="checkbox" id="autoFreshness" checked><span class="slider"></span></label>
      </div>
      <div class="row" style="margin-top:16px;">
        <div>
          <label>일일 수정 상품 수</label>
          <input type="text" id="dailyFreshness" value="7">
        </div>
        <div>
          <label>로테이션 주기 (일)</label>
          <input type="text" id="freshnessInterval" value="7">
        </div>
      </div>
    </div>

    <div class="section">
      <h2>🛡️ 안전 설정</h2>
      <div class="toggle-row">
        <div>
          <div class="toggle-label">수정 전 승인 필요</div>
          <div class="toggle-desc">AI가 생성한 제목/설명을 적용하기 전에 사용자 확인</div>
        </div>
        <label class="switch"><input type="checkbox" id="requireApproval" checked><span class="slider"></span></label>
      </div>
      <div class="toggle-row">
        <div>
          <div class="toggle-label">수정 전 백업 저장</div>
          <div class="toggle-desc">원본 제목/설명을 자동 백업</div>
        </div>
        <label class="switch"><input type="checkbox" id="autoBackup" checked><span class="slider"></span></label>
      </div>
    </div>

    <div class="footer-actions">
      <button class="btn btn-secondary" id="btnReset">초기화</button>
      <button class="btn btn-primary" id="btnSave">💾 설정 저장</button>
    </div>
    <div id="saveStatus" class="status" style="margin-top:12px;"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
